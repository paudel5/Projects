<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <div class="container">
    <h1>Expense Tracker</h1>

    <!-- Form to add a new expense -->
    <form action="/add" method="POST" class="expense-form">
      <input type="text" name="description" placeholder="What did you buy?" required>
      <input type="number" step="0.01" name="amount" placeholder="Amount ($)" required>

      <select name="category" required>
        <option value="Food">Food</option>
        <option value="Rent">Rent</option>
        <option value="Transportation">Transportation</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Other">Other</option>
      </select>

      <input type="date" name="date">
      <button type="submit">Add Expense</button>
    </form>

    <h2>Total spent: ${{ "%.2f"|format(total) }}</h2>

    <!-- Simple bar chart built from the /summary route -->
    <canvas id="chart" width="400" height="200"></canvas>

    <!-- Table of all expenses -->
    <table>
      <tr>
        <th>Date</th>
        <th>Description</th>
        <th>Category</th>
        <th>Amount</th>
        <th></th>
      </tr>
      {% for expense in expenses %}
      <tr>
        <td>{{ expense["date"] }}</td>
        <td>{{ expense["description"] }}</td>
        <td>{{ expense["category"] }}</td>
        <td>${{ "%.2f"|format(expense["amount"]) }}</td>
        <td>
          <form action="/delete/{{ expense['id'] }}" method="POST">
            <button type="submit">Delete</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </table>
  </div>

  <script src="{{ url_for('static', filename='chart.js') }}"></script>
</body>
</html>
